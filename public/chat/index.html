<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Desk — Chat</title>
  <style>
    :root{color-scheme:light;--ink:#18243d;--muted:#74809a;--line:#e7eaf3;--primary:#635bff;--cyan:#13c8c2;--panel:rgba(255,255,255,.88);--shadow:0 24px 70px rgba(52,46,135,.13)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8ff;background-image:radial-gradient(circle at 8% 8%,#ffe4f5 0,transparent 29%),radial-gradient(circle at 92% 13%,#d8f8ff 0,transparent 30%),linear-gradient(135deg,#f8f7ff,#f1fbfc)}
    .app-shell{width:min(1050px,100%);min-height:100vh;margin:auto;padding:22px;display:flex;flex-direction:column}.chat-card{min-height:calc(100vh - 44px);display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border:1px solid rgba(255,255,255,.8);border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(20px)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.72)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;color:white;font-size:23px;background:linear-gradient(135deg,var(--primary),#a855f7);box-shadow:0 9px 20px rgba(99,91,255,.28)}.brand h1{margin:0;font-size:18px;letter-spacing:-.02em}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.back-link{color:var(--muted);font-size:13px;text-decoration:none}.back-link:hover{color:var(--primary)}
    .settings{display:flex;align-items:center;gap:10px;padding:14px 28px;background:linear-gradient(90deg,#fff8fe,#f5ffff);border-bottom:1px solid var(--line)}.settings label{color:var(--muted);font-size:12px;font-weight:700}.settings select,.settings input{min-height:38px;border:1px solid #dfe3ef;border-radius:11px;outline:0;padding:8px 12px;color:var(--ink);font:inherit;font-size:13px;background:white;transition:.2s ease}.settings select:focus,.settings input:focus,.composer:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,91,255,.11)}.settings input{flex:1;min-width:130px}.clear-button{margin-left:auto;border:0;color:var(--muted);background:transparent;cursor:pointer;font:inherit;font-size:12px}.clear-button:hover{color:#e05275}
    .messages{flex:1;overflow:auto;padding:28px clamp(18px,5vw,70px);scroll-behavior:smooth}.welcome{max-width:600px;margin:20px auto 30px;text-align:center}.welcome .sparkle{font-size:40px}.welcome h2{margin:8px 0;font-size:clamp(23px,4vw,32px);letter-spacing:-.04em}.welcome p{margin:0 auto 22px;color:var(--muted);font-size:14px}.quick-prompts{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.quick-prompts button{border:1px solid #e0dffd;border-radius:999px;padding:9px 13px;color:#5148c9;background:#fff;cursor:pointer;font:inherit;font-size:12px;transition:.2s ease}.quick-prompts button:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 6px 15px rgba(99,91,255,.12)}
    .message-row{display:flex;align-items:flex-end;gap:10px;margin:16px 0;animation:rise .25s ease both}.message-row.user{justify-content:flex-end}.avatar{display:grid;flex:0 0 32px;place-items:center;width:32px;height:32px;border-radius:11px;color:white;font-size:15px;background:linear-gradient(135deg,var(--cyan),#4385ff)}.bubble{max-width:min(720px,78%);padding:13px 17px;border-radius:19px 19px 19px 5px;color:var(--ink);white-space:pre-wrap;line-height:1.65;font-size:14px;background:white;border:1px solid var(--line);box-shadow:0 5px 16px rgba(50,60,100,.05)}.user .bubble{border:0;border-radius:19px 19px 5px 19px;color:white;background:linear-gradient(135deg,var(--primary),#8b5cf6);box-shadow:0 8px 18px rgba(99,91,255,.22)}.typing{display:inline-flex;gap:4px;align-items:center;padding:17px}.typing i{width:6px;height:6px;border-radius:50%;background:#9da6be;animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes pulse{0%,70%,100%{opacity:.35;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
    .composer-wrap{padding:14px 28px 22px;border-top:1px solid var(--line);background:rgba(255,255,255,.72)}.composer{display:flex;align-items:flex-end;gap:10px;padding:7px;border:1px solid #dfe3ef;border-radius:17px;background:white;transition:.2s ease}.composer textarea{flex:1;min-height:42px;max-height:130px;resize:none;border:0;outline:0;padding:10px 11px;color:var(--ink);font:inherit;font-size:14px;line-height:1.5}.send-button{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:12px;color:white;background:linear-gradient(135deg,var(--primary),#a855f7);cursor:pointer;font-size:18px;transition:.2s ease}.send-button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 15px rgba(99,91,255,.25)}.send-button:disabled{opacity:.55;cursor:wait}.hint{margin:8px 3px 0;color:var(--muted);font-size:11px}
    @media(max-width:600px){.app-shell{padding:0}.chat-card{min-height:100vh;border-radius:0}.topbar,.settings,.composer-wrap{padding-left:16px;padding-right:16px}.topbar{padding-top:17px;padding-bottom:17px}.back-link{display:none}.settings{flex-wrap:wrap}.clear-button{margin-left:0}.messages{padding:22px 14px}.bubble{max-width:88%}.composer-wrap{padding-bottom:15px}}
  </style>
</head>
<body>
  <main class="app-shell"><section class="chat-card">
    <header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><h1>AI Desk Chat</h1><p>ผู้ช่วย AI สำหรับไอเดียและงานของคุณ</p></div></div><a class="back-link" href="/">← กลับ Portal Hub</a></header>
    <section class="settings" aria-label="ตั้งค่า provider"><label for="provider">Provider</label><select id="provider"><option value="gemini">✨ Gemini</option><option value="openai">◉ OpenAI</option><option value="openai-compat">⚡ Custom gateway</option></select><input id="model" placeholder="ชื่อ model (เว้นว่างใช้ค่าเริ่มต้น)" aria-label="ชื่อ model"><button class="clear-button" id="clear" type="button">ล้างแชท</button></section>
    <div id="messages" class="messages"><div class="welcome" id="welcome"><div class="sparkle">🌈</div><h2>วันนี้ให้ช่วยเรื่องอะไรดี?</h2><p>เริ่มต้นบทสนทนากับผู้ช่วย AI ได้เลย เลือก provider ด้านบนแล้วพิมพ์ข้อความ</p><div class="quick-prompts"><button type="button">ช่วยคิดไอเดียโปรเจกต์</button><button type="button">สรุปข้อความให้หน่อย</button><button type="button">อธิบายเรื่องยากให้เข้าใจง่าย</button></div></div></div>
    <div class="composer-wrap"><form id="form" class="composer"><textarea id="message" rows="1" placeholder="พิมพ์ข้อความของคุณ..." aria-label="ข้อความ" required></textarea><button class="send-button" type="submit" aria-label="ส่งข้อความ">➤</button></form><div class="hint">กด Enter เพื่อส่ง · Shift + Enter เพื่อขึ้นบรรทัดใหม่</div></div>
  </section></main><script src="/chat/app.js"></script>
</body>
</html>
