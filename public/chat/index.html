<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Desk — Chat</title>
  <style>
    :root{color-scheme:dark;--blue-950:#07152f;--blue-900:#0a2147;--blue-800:#0d3268;--blue:#1479e8;--blue-bright:#35a7ff;--red:#ff4d5f;--red-dark:#dc3046;--yellow:#ffd447;--yellow-soft:#fff0a8;--text:#eef6ff;--muted:#9bb2cf;--line:#234878;--panel:#0b2855;--input:#081d3d;--shadow:0 22px 60px rgba(0,0,0,.32)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--blue-950);background-image:radial-gradient(circle at 10% 0,rgba(20,121,232,.32),transparent 34%),radial-gradient(circle at 100% 100%,rgba(255,77,95,.17),transparent 30%)}.app-shell{width:min(1080px,100%);min-height:100vh;margin:auto;padding:24px}.chat-card{min-height:calc(100vh - 48px);display:flex;flex-direction:column;overflow:hidden;background:var(--blue-900);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 28px;border-bottom:1px solid var(--line);background:var(--blue-800)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;color:var(--blue-950);background:var(--yellow);font-size:21px;box-shadow:0 0 20px rgba(255,212,71,.2)}.brand h1{margin:0;font-size:18px;font-weight:750;letter-spacing:-.02em}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.back-link{color:#c5d8ef;font-size:13px;text-decoration:none}.back-link:hover{color:var(--yellow)}
    .settings{display:flex;align-items:center;gap:12px;padding:13px 28px;border-bottom:1px solid var(--line);background:#0b2855}.settings label{color:var(--yellow);font-size:12px;font-weight:750}.settings select,.settings input{height:38px;border:1px solid #31598a;border-radius:8px;outline:0;padding:0 11px;color:var(--text);font:inherit;font-size:13px;background:var(--input)}.settings select:focus,.settings input:focus,.composer:focus-within{border-color:var(--blue-bright);box-shadow:0 0 0 3px rgba(53,167,255,.18)}.settings input{flex:1;min-width:150px}.clear-button{margin-left:auto;border:1px solid rgba(255,77,95,.45);border-radius:7px;padding:7px 11px;color:#ff98a3;background:transparent;cursor:pointer;font:inherit;font-size:12px}.clear-button:hover{border-color:var(--red);color:#fff;background:rgba(255,77,95,.16)}
    .messages{flex:1;overflow:auto;padding:28px clamp(18px,6vw,78px);scroll-behavior:smooth}.welcome{max-width:610px;margin:42px auto;text-align:center}.welcome .welcome-icon{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 18px;border-radius:16px;color:var(--blue-950);background:var(--yellow);font-size:26px;box-shadow:0 0 24px rgba(255,212,71,.15)}.welcome h2{margin:0 0 10px;color:var(--text);font-size:clamp(23px,4vw,30px);font-weight:750;letter-spacing:-.035em}.welcome p{margin:0 auto 24px;color:var(--muted);font-size:14px}.quick-prompts{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.quick-prompts button{border:1px solid #a98816;border-radius:8px;padding:10px 13px;color:var(--yellow-soft);background:#4d4216;cursor:pointer;font:inherit;font-size:12px;transition:.18s ease}.quick-prompts button:hover{border-color:var(--yellow);background:#69591a}
    .message-row{display:flex;align-items:flex-end;gap:10px;margin:18px 0;animation:rise .2s ease both}.message-row.user{justify-content:flex-end}.avatar{display:grid;flex:0 0 30px;place-items:center;width:30px;height:30px;border-radius:9px;color:#bde2ff;background:#124c88;font-size:14px}.bubble{max-width:min(720px,80%);padding:12px 16px;border:1px solid var(--line);border-radius:12px 12px 12px 3px;color:var(--text);white-space:pre-wrap;line-height:1.65;font-size:14px;background:var(--panel)}.user .bubble{border-color:var(--red);border-radius:12px 12px 3px 12px;color:#fff;background:var(--red-dark);box-shadow:0 6px 15px rgba(255,77,95,.15)}.typing{display:inline-flex;gap:4px;align-items:center;padding:16px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--yellow);animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes pulse{0%,70%,100%{opacity:.35;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
    .composer-wrap{padding:14px 28px 21px;border-top:1px solid var(--line);background:var(--blue-800)}.composer{display:flex;align-items:flex-end;gap:9px;padding:6px 6px 6px 10px;border:1px solid #31598a;border-radius:11px;background:var(--input);transition:.18s ease}.composer textarea{flex:1;min-height:42px;max-height:130px;resize:none;border:0;outline:0;padding:10px 5px;color:var(--text);font:inherit;font-size:14px;line-height:1.5;background:transparent}.composer textarea::placeholder{color:#7894b6}.send-button{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:8px;color:var(--blue-950);background:var(--yellow);cursor:pointer;font-size:17px;transition:.18s ease}.send-button:hover:not(:disabled){background:#ffe477;transform:translateY(-1px)}.send-button:disabled{opacity:.55;cursor:wait}.hint{margin:8px 3px 0;color:var(--muted);font-size:11px}
    @media(max-width:600px){.app-shell{padding:0}.chat-card{min-height:100vh;border-radius:0;border:0}.topbar,.settings,.composer-wrap{padding-left:16px;padding-right:16px}.topbar{padding-top:16px;padding-bottom:16px}.back-link{display:none}.settings{flex-wrap:wrap;gap:8px}.clear-button{margin-left:0}.messages{padding:22px 14px}.welcome{margin:28px auto}.bubble{max-width:88%}.composer-wrap{padding-bottom:14px}}
  </style>
</head>
<body>
  <main class="app-shell"><section class="chat-card">
    <header class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><h1>AI Desk Chat</h1><p>ผู้ช่วย AI สำหรับไอเดียและงานของคุณ</p></div></div><a class="back-link" href="/">← กลับ Portal Hub</a></header>
    <section class="settings" aria-label="ตั้งค่า provider"><label for="provider">Provider</label><select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select><input id="model" placeholder="ชื่อ model (เว้นว่างใช้ค่าเริ่มต้น)" aria-label="ชื่อ model"><button class="clear-button" id="clear" type="button">ล้างแชท</button></section>
    <div id="messages" class="messages"><div class="welcome" id="welcome"><div class="welcome-icon">✦</div><h2>วันนี้ให้ช่วยเรื่องอะไรดี?</h2><p>เลือก provider ด้านบน แล้วพิมพ์ข้อความเพื่อเริ่มต้นสนทนา</p><div class="quick-prompts"><button type="button">ช่วยคิดไอเดียโปรเจกต์</button><button type="button">สรุปข้อความให้หน่อย</button><button type="button">อธิบายเรื่องยากให้เข้าใจง่าย</button></div></div></div>
    <div class="composer-wrap"><form id="form" class="composer"><textarea id="message" rows="1" placeholder="พิมพ์ข้อความของคุณ..." aria-label="ข้อความ" required></textarea><button class="send-button" type="submit" aria-label="ส่งข้อความ">➤</button></form><div class="hint">กด Enter เพื่อส่ง · Shift + Enter เพื่อขึ้นบรรทัดใหม่</div></div>
  </section></main><script src="/chat/app.js"></script>
</body>
</html>
